# Dependabot opent elke dag PR's voor nieuwe versies. dependabot-samenvoegen.yml
# merget ze vanzelf als de controles groen zijn; anders een melding in #git-updates.
version: 2
updates:
  - package-ecosystem: pip
    directories: ["/", "/packaging"]
    schedule:
      interval: daily
      time: "06:00"
      timezone: Europe/Amsterdam
    open-pull-requests-limit: 5
    groups:
      # Kleine updates samen in één PR; major-updates (kunnen breken) apart.
      python-minor-en-patch:
        update-types: [minor, patch]

  - package-ecosystem: docker
    directory: "/"
    schedule:
      interval: daily
      time: "06:00"
      timezone: Europe/Amsterdam
    open-pull-requests-limit: 5

  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: daily
      time: "06:00"
      timezone: Europe/Amsterdam
    open-pull-requests-limit: 5
